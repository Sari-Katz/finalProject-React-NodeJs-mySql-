name: Full CI/CD Pipeline - React + Node + Docker Compose

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    name: CI - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
           node-version: 18
           cache: "npm"
           cache-dependency-path: |
             client/package-lock.json
             server/package-lock.json


      # ===== CLIENT =====
      - name: Install client dependencies
        working-directory: client
        run: npm install

      - name: Lint client
        working-directory: client
        run: npm run lint || true

      - name: Build client
        working-directory: client
        run: npm run build

      # ===== SERVER =====
      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Server sanity check
        working-directory: server
        run: node -v

  docker:
    name: Docker Build & Push
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Client Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/myapp-client:latest ./client
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/myapp-client:latest

      - name: Build & Push Server Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/myapp-server:latest ./server
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/myapp-server:latest

  compose:
    name: Docker Compose Validation
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker Compose Build
        run: docker-compose build
